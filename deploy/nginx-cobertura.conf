# Exemplo para Nginx + PHP-FPM (o instalar.sh só configura o Apache).
# Salve em /etc/nginx/sites-available/cobertura, crie o link em sites-enabled
# e ajuste o socket do PHP-FPM.
server {
    listen 18443;
    root /var/www/cobertura;
    index index.php;

    location ~ ^/(lib|sql|data|bin|deploy|\.git)/ { deny all; }
    location = /config.local.php { deny all; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
