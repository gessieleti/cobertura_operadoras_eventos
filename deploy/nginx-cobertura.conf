# Exemplo para Nginx + PHP-FPM (o instalar.sh só configura o Apache).
# Coloque dentro do bloco server {} do site e ajuste o socket do PHP-FPM.
location ^~ /cobertura/ {
    alias /var/www/cobertura/;
    index index.php;

    location ~ ^/cobertura/(lib|sql|data|bin|deploy|\.git)/ { deny all; }
    location = /cobertura/config.local.php { deny all; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
